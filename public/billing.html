<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billing · Papinoice</title><link rel="stylesheet" href="/css/style.css"></head><body><script src="/js/common.js"></script><script>let all=[],cart=[],filter='ALL',payment='Cash';layout('billing').then(()=>{page.innerHTML=`<div class="title-row"><div class="title"><h1>Billing</h1><p>Fast billing · stock updates automatically</p></div><button class="btn">◷ Recent bills</button></div><div class="billing"><section><div class="search-row"><input class="search" id="q" placeholder="⌕  Search flavours..."><div class="filters"><button class="filter active" data-f="ALL">All</button><button class="filter" data-f="IN">In stock</button><button class="filter" data-f="LOW">Low</button><button class="filter" data-f="OUT">Out</button></div></div><div class="product-grid" id="products"></div></section><aside class="bill"><div class="bill-head"><h2>Current bill</h2><button class="btn danger" onclick="cart=[];renderCart()">Clear</button></div><div class="cart" id="cart"><div class="empty">🛒 Tap flavours to add them to the bill</div></div><div class="sum"><span>Subtotal</span><strong id="subtotal">₹0</strong></div><div class="total"><span>TOTAL</span><span id="total">₹0</span></div><div class="payments"><button class="pay active" data-p="Cash">▣<br>Cash</button><button class="pay" data-p="UPI">▦<br>UPI</button><button class="pay" data-p="Card">▤<br>Card</button></div><div class="row" style="margin-top:14px"><button class="btn primary" style="flex:1" onclick="saveBill(true)">SAVE & PRINT</button><button class="btn" onclick="saveBill(false)">Save only</button></div></aside></div>`;return api('/products')}).then(x=>{all=x;renderProducts()});function renderProducts(){const qv=document.getElementById('q').value.toLowerCase();document.getElementById('products').innerHTML=all.filter(p=>(filter==='ALL'||p.status===filter)&&p.name.toLowerCase().includes(qv)).map(p=>`<div class="product-card"><div class="pic ${p.bg}">${p.emoji}</div><h3>${esc(p.name)}</h3><div class="price">${money(p.price)} <span class="status ${p.status==='IN'?'in':p.status==='LOW'?'low':'out'}">● ${p.status==='IN'?'IN STOCK':p.status==='LOW'?'LOW':'OUT OF STOCK'}</span></div><div class="stockline">${p.stock} sticks · ${p.boxes} box + ${p.rem} sticks</div><button class="add" ${p.stock<=0?'disabled':''} onclick="add('${p.id}')">＋ ADD TO BILL</button></div>`).join('')||'<p>No flavours found.</p>'}function add(id){const p=all.find(x=>x.id===id),c=cart.find(x=>x.productId===id);if(c){if(c.qty<p.stock)c.qty++;else return toast('Not enough stock')}else cart.push({productId:id,name:p.name,price:p.price,qty:1,stock:p.stock});renderCart()}function renderCart(){const el=document.getElementById('cart');if(!cart.length){el.innerHTML='<div class="empty">🛒 Tap flavours to add them to the bill</div>';subtotal.textContent=total.textContent=money(0);return}const sub=cart.reduce((a,x)=>a+x.price*x.qty,0);subtotal.textContent=total.textContent=money(sub);el.innerHTML=cart.map((x,i)=>`<div class="cart-item"><div><b>${esc(x.name)}</b><div class="muted">${money(x.price)} × ${x.qty}</div></div><div class="qty"><button onclick="chg(${i},-1)">−</button><b>${x.qty}</b><button onclick="chg(${i},1)">+</button></div></div>`).join('')}function chg(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);else if(cart[i].qty>cart[i].stock)cart[i].qty=cart[i].stock;renderCart()}document.addEventListener('input',e=>{if(e.target.id==='q')renderProducts()});document.addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b){document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;renderProducts()}const p=e.target.closest('[data-p]');if(p){document.querySelectorAll('[data-p]').forEach(x=>x.classList.remove('active'));p.classList.add('active');payment=p.dataset.p}});async function saveBill(print){if(!cart.length)return toast('Add at least one flavour');try{const s=await api('/bills',{method:'POST',body:JSON.stringify({items:cart,payment})});toast(s.billNo+' saved. Stock updated.');if(print){const w=open('','_blank','width=420,height=700');w.document.write(`<h2 style="text-align:center">Papinoice</h2><p>Bill: ${s.billNo}</p><hr>${s.items.map(i=>`<p>${i.name} × ${i.qty} — ${money(i.line)}</p>`).join('')}<hr><h3>Total: ${money(s.total)}</h3><p>Payment: ${s.payment}</p><script>print()<\/script>`);w.document.close()}cart=[];all=await api('/products');renderProducts();renderCart()}catch(e){toast(e.message)}}</script></body></html>
