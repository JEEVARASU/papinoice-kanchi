<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory · Papinoice</title><link rel="stylesheet" href="/css/style.css"></head><body><script src="/js/common.js"></script><script>layout('inventory').then(()=>{page.innerHTML=`<div class="title-row"><div class="title"><h1>Inventory & Stock</h1><p>1 box = 24 sticks</p></div><button class="btn primary" onclick="stockIn()">＋ Add Stock</button></div><div class="cards"><div class="card"><h3>Flavours</h3><div class="big" id="fc">0</div></div><div class="card"><h3>Sticks in Freezer</h3><div class="big" id="sc">0</div></div><div class="card"><h3>Low Stock</h3><div class="big" id="lc">0</div></div><div class="card"><h3>Out of Stock</h3><div class="big" id="oc">0</div></div></div><div style="height:18px"></div><div class="tablewrap"><table class="table"><thead><tr><th>ID</th><th>Flavour</th><th>Price</th><th>Stock</th><th>Boxes + sticks</th><th>Min</th><th>Status</th><th>Actions</th></tr></thead><tbody id="tb"></tbody></table></div>`;return api('/products')}).then(render);async function render(ps){fc.textContent=ps.length;sc.textContent=ps.reduce((a,p)=>a+p.stock,0);lc.textContent=ps.filter(p=>p.status==='LOW').length;oc.textContent=ps.filter(p=>p.status==='OUT').length;tb.innerHTML=ps.map(p=>`<tr><td>${p.id}</td><td><b>${p.emoji} ${esc(p.name)}</b></td><td>${money(p.price)}</td><td><b>${p.stock}</b></td><td>${p.boxes} box + ${p.rem} sticks</td><td>${p.minStock}</td><td><span class="pill ${p.status==='IN'?'in':p.status==='LOW'?'low':'out'}">${p.status}</span></td><td><button class="btn" onclick="stockIn('${p.id}')">＋</button> <button class="btn danger" onclick="damage('${p.id}')">−</button></td></tr>`).join('')}async function stockIn(id){const boxes=prompt('Boxes to add (1 box = 24 sticks):','1');if(boxes===null)return;const sticks=prompt('Extra individual sticks:','0');if(sticks===null)return;try{await api('/stock',{method:'POST',body:JSON.stringify({productId:id||prompt('Product ID:'),boxes:Number(boxes),sticks:Number(sticks)})});toast('Stock updated');render(await api('/products'))}catch(e){toast(e.message)}}async function damage(id){const qty=prompt('Damaged sticks:','1');if(qty===null)return;try{await api('/damage',{method:'POST',body:JSON.stringify({productId:id,qty:Number(qty)})});toast('Damage recorded');render(await api('/products'))}catch(e){toast(e.message)}}</script></body></html>
