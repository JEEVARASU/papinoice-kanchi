<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products · Papinoice</title><link rel="stylesheet" href="/css/style.css"></head><body><script src="/js/common.js"></script><script>layout('products').then(()=>{page.innerHTML=`<div class="title-row"><div class="title"><h1>Products & Flavours</h1><p>Manage your Papinoice flavours</p></div><button class="btn primary" onclick="addProduct()">＋ Add flavour</button></div><div class="tablewrap"><table class="table"><thead><tr><th>ID</th><th>Flavour</th><th>Price</th><th>Stock</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table></div>`;return api('/products')}).then(ps=>tb.innerHTML=ps.map(p=>`<tr><td>${p.id}</td><td>${p.emoji} <b>${esc(p.name)}</b></td><td>${money(p.price)}</td><td>${p.stock}</td><td><span class="pill ${p.status==='IN'?'in':p.status==='LOW'?'low':'out'}">${p.status}</span></td></tr>`).join(''));async function addProduct(){const name=prompt('Flavour name:');if(!name)return;const price=prompt('Price:','35');try{await api('/products',{method:'POST',body:JSON.stringify({name,price:Number(price)})});location.reload()}catch(e){toast(e.message)}}</script></body></html>
