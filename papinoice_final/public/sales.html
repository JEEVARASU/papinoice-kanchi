<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales · Papinoice</title><link rel="stylesheet" href="/css/style.css"></head><body><script src="/js/common.js"></script><script>layout('sales').then(()=>{page.innerHTML=`<div class="title-row"><div class="title"><h1>Sales & Bills</h1><p>All saved bills</p></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Bill No</th><th>Date</th><th>Staff</th><th>Payment</th><th>Items</th><th>Total</th></tr></thead><tbody id="tb"></tbody></table></div>`;return api('/sales')}).then(xs=>tb.innerHTML=xs.length?xs.map(s=>`<tr><td><b>${s.billNo}</b></td><td>${new Date(s.time).toLocaleString()}</td><td>${esc(s.staff)}</td><td>${s.payment}</td><td>${s.items.reduce((a,i)=>a+i.qty,0)}</td><td>${money(s.total)}</td></tr>`).join(''):'<tr><td colspan="6">No sales yet.</td></tr>')</script></body></html>
