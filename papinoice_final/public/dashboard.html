<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · Papinoice</title><link rel="stylesheet" href="/css/style.css"></head><body><script src="/js/common.js"></script><script>layout('dashboard').then(()=>{page.innerHTML=`<div class="title-row"><div class="title"><h1>Dashboard</h1><p>Overview of your Papinoice business</p></div></div><div class="cards"><div class="card"><h3>Today's Sales</h3><div class="big" id="s">₹0</div></div><div class="card"><h3>Today's Bills</h3><div class="big" id="b">0</div></div><div class="card"><h3>Sticks Sold</h3><div class="big" id="st">0</div></div><div class="card"><h3>Out of Stock</h3><div class="big" id="o">0</div></div></div><div style="height:18px"></div><div class="cards"><div class="card"><h3>Total Flavours</h3><div class="big" id="p">0</div></div><div class="card"><h3>Low Stock</h3><div class="big" id="l">0</div></div></div>`;return api('/dashboard')}).then(x=>{s.textContent=money(x.sales);b.textContent=x.bills;st.textContent=x.sticks;o.textContent=x.out;p.textContent=x.products;l.textContent=x.low})</script></body></html>
